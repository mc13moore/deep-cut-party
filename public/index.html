<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Cut: Rare Answer Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d14;--panel:#1a1722;--panel2:#221e2c;--line:#2e2a3a;--ink:#f4efe7;--mute:#9b94a9;
  --c:#b9b3c4;--u:#3cc6b4;--r:#a77bff;--g:#ffc24b;--bad:#ff6b6b;--accent:#ff7a45;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:22px 18px 48px}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:46px;line-height:1;margin:6px 0 6px;letter-spacing:-.5px}
h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px;font-size:15px;line-height:1.45}
.brand{display:flex;align-items:center;gap:14px}
.disc{width:58px;height:58px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.mode{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .12s,border-color .12s}
.mode:hover{border-color:#4a4459;transform:translateY(-1px)}
.mode .t{font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.mode .d{color:var(--mute);font-size:14px;margin-top:4px;line-height:1.4}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tier{border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2);border:1px solid var(--line)}
.tier b{display:block;font-size:20px}
.tier span{font-size:12px;color:var(--mute)}
.howto{font-size:14px;color:var(--mute);line-height:1.55}
.howto b{color:var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--mute);font-size:14px}
.topbar .score{color:var(--ink);font-weight:700;font-size:16px}
.linkbtn{background:none;border:none;color:var(--mute);font:inherit;cursor:pointer;padding:4px 0}
.linkbtn:hover{color:var(--ink)}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center}
.ringwrap{position:relative;width:150px;height:150px;margin:4px 0 14px}
.ringwrap svg{position:absolute;inset:0}
.ringwrap .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.spin{animation:spin 3s linear infinite;transform-origin:75px 75px}
@keyframes spin{to{transform:rotate(360deg)}}
.q{font-family:'DM Serif Display',serif;font-size:30px;line-height:1.15;margin:4px 0 18px;min-height:70px;display:flex;align-items:center;justify-content:center}
form{width:100%;display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:18px;padding:14px 16px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#1a0d06;border:none;border-radius:14px;font:inherit;font-weight:700;font-size:16px;padding:14px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%;margin-top:10px}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--mute)}
.msg.bad{color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ink)}
.badge{display:inline-block;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.b-c{background:rgba(185,179,196,.15);color:var(--c)}
.b-u{background:rgba(60,198,180,.15);color:var(--u)}
.b-r{background:rgba(167,123,255,.17);color:var(--r)}
.b-g{background:rgba(255,194,75,.17);color:var(--g)}
.b-x{background:rgba(255,107,107,.13);color:var(--bad)}
.pts{font-size:56px;font-weight:700;margin:10px 0 0;line-height:1}
.yours{color:var(--mute);margin:8px 0 18px}
.reveal-list{text-align:left;width:100%}
.reveal-list .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.reveal-list .row span:first-child{color:var(--mute)}
.reveal-list .row span:last-child{text-align:right}
.gem{color:var(--g);font-weight:700}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 16px;border-radius:99px;font-weight:700;background:var(--panel2);border:1px solid var(--line);opacity:0;transition:opacity .2s,top .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;top:26px}
.res-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.res-row .rq{color:var(--mute);font-size:13px;grid-column:1/-1}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.grid{font-size:26px;letter-spacing:4px;margin:8px 0 4px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.vs .card{text-align:center;margin:0}
.vs .win{border-color:var(--g)}
.field{display:flex;gap:8px;margin-top:10px}
.field input{font-size:16px;padding:12px 14px}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:26px}
.mode.party{border-color:#5a3a2a;background:linear-gradient(135deg,#2a1a17,#1a1722 70%)}
.section-label{color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:22px 0 10px}
.teamgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.teambtn{background:var(--panel2);border:2px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:22px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.teambtn span{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.teambtn.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,var(--panel2))}
.teamgrid.small .teambtn{font-size:18px;padding:8px 4px}
.scorecard{border:2px solid var(--tc);border-radius:22px;padding:24px 18px;text-align:center;background:color-mix(in srgb,var(--tc) 10%,var(--panel))}
.sc-team{font-weight:700;color:var(--tc);letter-spacing:.04em}
.sc-name{font-family:'DM Serif Display',serif;font-size:30px;margin-top:6px}
.teamrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.teamrow:first-child{border-top:none}
.rank{width:28px;text-align:center;font-size:20px;color:var(--mute);padding-top:2px}
.bar{height:8px;border-radius:99px;background:var(--panel2);margin:8px 0 6px;overflow:hidden}
.bar div{height:100%;border-radius:99px;transition:width .4s}
.tmeta{font-size:12px;color:var(--mute);line-height:1.4}
.rename{font-size:15px!important;padding:6px 10px!important;max-width:180px}
.entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.x{background:none;border:none;color:var(--mute);cursor:pointer;font-size:14px;margin-left:8px;padding:4px}
.x:hover{color:var(--bad)}
.roundrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.roundrow:first-child{border-top:none}
.roundrow .rl{font-weight:700;font-size:17px}
.roundrow .rs{color:var(--mute);font-size:14px;margin-top:3px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.rsplit{font-size:12px;color:var(--mute);white-space:nowrap}
.r2card{border-color:#4a4459}
.r2card.open{border-color:rgba(60,198,180,.6);background:color-mix(in srgb,var(--u) 8%,var(--panel))}
.sendstat{margin:14px 0;padding:12px 14px;border-radius:14px;font-size:15px;text-align:center;border:1px solid var(--line);background:var(--panel)}
.sendstat.ok{border-color:rgba(60,198,180,.5);color:var(--u)}
.sendstat.ok b{color:var(--ink)}
.sendstat.bad{border-color:rgba(255,107,107,.5);color:var(--bad)}
.sendstat.wait{color:var(--mute)}
.livedot{font-size:13px;color:var(--mute)}
.livedot.ok{color:var(--u)}
.livedot.error{color:var(--bad)}
.testbanner{background:repeating-linear-gradient(45deg,rgba(255,122,69,.16) 0 10px,rgba(255,122,69,.08) 10px 20px);border:1px dashed var(--accent);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:.03em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{background:none;border:none;color:var(--mute);font:inherit;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink)}
</style>
</head>
<body>
<div class="app" id="app"></div>

/* ---------- Helpers ---------- */
const TIERS = {
  c:{name:"Common",pts:10,cls:"b-c",sq:"⬜",bonus:2},
  u:{name:"Uncommon",pts:25,cls:"b-u",sq:"🟩",bonus:4},
  r:{name:"Rare",pts:50,cls:"b-r",sq:"🟪",bonus:6},
  g:{name:"Gem",pts:100,cls:"b-g",sq:"💎",bonus:10},
};
const MISS_SQ = "⬛";
const PER_PROMPT = 40, ROUND = 7, ENDLESS_START = 45;
const TEAMS = [
  {n:"Team 1",col:"#ff6b6b",e:"🔴"},{n:"Team 2",col:"#ffa94d",e:"🟠"},{n:"Team 3",col:"#ffd43b",e:"🟡"},
  {n:"Team 4",col:"#51cf66",e:"🟢"},{n:"Team 5",col:"#4dabf7",e:"🔵"},{n:"Team 6",col:"#b197fc",e:"🟣"},
];
const TEAM_SIZE = 5;
const BASE_PROMPTS = 28; // prompts before the Round 2 block; keeps Round 1 and test runs unchanged
const PARTY_ROUNDS = 6;

function norm(s){
  s = (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/&/g," and ").replace(/[’'`]/g,"").trim();
  s = s.replace(/^the\s+/,"");
  return s.replace(/[^a-z0-9]/g,"");
}
function titleCase(s){return s.split(" ").map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(" ")}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const m=a.length,n=b.length; const d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=0;j<=n;j++){d[0][j]=j;}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
// Build the index once
const INDEX = BANK.map(p=>{
  const entries=[], claimed=new Set();
  // Gem claims first; otherwise an answer listed twice keeps its most common tier.
  for(const t of ["g","c","u","r"]){
    if(!p[t]) continue;
    for(const item of p[t].split("|")){
      const alts=item.split("/").map(x=>x.trim()).filter(Boolean);
      const keys=alts.map(norm).filter(k=>k&&!claimed.has(k));
      if(!keys.length) continue;
      keys.forEach(k=>claimed.add(k));
      entries.push({tier:t,label:titleCase(alts[0]),keys});
    }
  }
  return entries;
});
function matchAnswer(pi, input){
  const n=norm(input); if(n.length<2) return null;
  const E=INDEX[pi];
  const variants=[n, n.replace(/s$/,""), n+"s", n.replace(/es$/,"")];
  for(const e of E) for(const k of e.keys) if(variants.includes(k)) return e;
  if(n.length>=5){
    let best=null,bd=9;
    for(const e of E) for(const k of e.keys){
      const tol = k.length>=9?2:1;
      const d=lev(n,k); if(d<=tol && d<bd){bd=d;best=e;}
    }
    return best;
  }
  return null;
}
function gemOf(pi){return INDEX[pi].find(e=>e.tier==="g")}
function sample(arr,k){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,k)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dailyNumber(){const a=new Date(2026,10,7);const d=new Date();d.setHours(0,0,0,0);return Math.floor((d-a)/864e5)+1}
function dailyPrompts(){
  const key=todayKey(); let h=2166136261; for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const r=mulberry32(h>>>0); const idx=POOL.slice();
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,ROUND);
}
function partyPrompts(){
  // Fixed set: identical for every guest, on every device, all night.
  let h=2166136261; for(const ch of "deepcut-birthday-party"){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const r=mulberry32(h>>>0); const idx=Array.from({length:BASE_PROMPTS},(_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,ROUND);
}
// The party set is walled off: warm-ups and test runs only ever draw from POOL.
const PARTY = partyPrompts();                      // Round 1
// Rounds 2+ are the following blocks of 7 after the base prompts, in order.
const roundBlock = n => Array.from({length:ROUND},(_,i)=>BASE_PROMPTS+(n-2)*ROUND+i);
const PARTY_SETS = Object.fromEntries(Array.from({length:PARTY_ROUNDS},(_,i)=>[i+1, i===0?PARTY:roundBlock(i+1)]));
const POOL = Array.from({length:BASE_PROMPTS},(_,i)=>i).filter(i=>!PARTY.includes(i));
const TEST_RUNS = Math.floor(POOL.length/ROUND); // 3 non-overlapping test sets
function testPrompts(run){
  let h=2166136261; for(const ch of "deepcut-test-runs"){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const r=mulberry32(h>>>0); const idx=POOL.slice();
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice((run-1)*ROUND, run*ROUND);
}
function randomPrompts(k){return sample(POOL,Math.min(k,POOL.length))}
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let toastT;
function toast(text,color){const t=document.getElementById("toast");t.textContent=text;t.style.color=color||"var(--ink)";t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1100)}

/* ---------- Game flow ---------- */
function start(mode, extra){
  G={mode, i:0, results:[], score:0, stage:"play", tried:0};
  if(mode==="daily"){G.prompts=dailyPrompts();}
  else if(mode==="party"){Object.assign(G,extra);G.prompts=(PARTY_SETS[G.round]||PARTY).slice();}
  else if(mode==="test"){Object.assign(G,extra);G.prompts=testPrompts(G.run);}
  else if(mode==="endless"){G.prompts=randomPrompts(BANK.length);G.deadline=performance.now()+ENDLESS_START*1000;}
  else if(mode==="versus"){Object.assign(G,extra);}
  playPrompt();
}
function curPrompt(){return G.prompts[G.i % G.prompts.length]}

function playPrompt(){
  G.stage="play"; G.tried=0;
  const pi=curPrompt();
  if(G.mode!=="endless") G.deadline=performance.now()+PER_PROMPT*1000;
  const who = G.mode==="versus" ? `${esc(G.players[G.p].name)} · ` : G.mode==="party" ? `${TEAMS[G.team].e} R${G.round} · ` : G.mode==="test" ? `🧪 ${TEAMS[G.team].e} ` : "";
  const progress = G.mode==="endless"
    ? `<span>${G.results.length} answered</span>`
    : `<span>${who}${G.i+1} / ${ROUND}</span>`;
  const dots = G.mode==="endless" ? "" : `<div class="dots">${Array.from({length:ROUND},(_,k)=>`<div class="dot ${k<=G.i?"on":""}"></div>`).join("")}</div>`;
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Quit</button>${progress}<span class="score">${G.score} pts</span></div>
  <div class="stage">
    ${dots}
    <div class="ringwrap">
      <svg viewBox="0 0 150 150" width="150" height="150">
        <g class="spin">
          <circle cx="75" cy="75" r="62" fill="#16131d"/>
          <circle cx="75" cy="75" r="52" fill="none" stroke="#221e2b"/>
          <circle cx="75" cy="75" r="44" fill="none" stroke="#221e2b"/>
          <circle cx="75" cy="75" r="36" fill="none" stroke="#221e2b"/>
          <path d="M75 20 A55 55 0 0 1 120 45" stroke="#2c2838" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="75" cy="75" r="24" fill="var(--accent)" opacity=".9"/>
        </g>
        <circle cx="75" cy="75" r="70" fill="none" stroke="#2a2635" stroke-width="6"/>
        <circle id="ring" cx="75" cy="75" r="70" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
          transform="rotate(-90 75 75)" stroke-dasharray="${2*Math.PI*70}" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="num"></div>
    </div>
    <div class="q">${esc(BANK[pi].q)}</div>
    <form id="f" autocomplete="off">
      <input type="text" id="ans" placeholder="Go deep…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" type="submit">Lock</button>
    </form>
    <div class="msg" id="msg">&nbsp;</div>
    <button class="btn ghost wide" id="pass" type="button">${G.mode==="endless"?"Pass (−3s)":"Pass"}</button>
  </div>`;
  const inp=document.getElementById("ans"); inp.focus();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();submit(inp.value);};
  document.getElementById("pass").onclick=()=>{
    if(G.mode==="endless"){G.deadline-=3000;G.results.push({pi,ans:"",m:null});G.i++;toast("−3s","var(--bad)");playPrompt();}
    else finishPrompt(null,"");
  };
  document.getElementById("quit").onclick=home;
  tick();
}

function tick(){
  cancelAnimationFrame(raf);
  const ring=document.getElementById("ring"), num=document.getElementById("num");
  const C=2*Math.PI*70;
  const loop=()=>{
    if(!G||G.stage!=="play") return;
    const left=Math.max(0,(G.deadline-performance.now())/1000);
    const max = G.mode==="endless"?Math.max(ENDLESS_START,left):PER_PROMPT;
    ring.setAttribute("stroke-dashoffset", C*(1-left/max));
    ring.setAttribute("stroke", left<6?"var(--bad)":"var(--accent)");
    num.textContent=Math.ceil(left);
    if(left<=0){
      if(G.mode==="endless") return endGame();
      return finishPrompt(null, document.getElementById("ans")?.value||"");
    }
    raf=requestAnimationFrame(loop);
  };
  loop();
}

function submit(val){
  if(!G||G.stage!=="play") return;
  const inp=document.getElementById("ans"), msg=document.getElementById("msg");
  if(!val.trim()) return;
  const m=matchAnswer(curPrompt(), val);
  if(!m){
    G.tried++;
    inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    msg.className="msg bad";
    msg.textContent = G.mode==="endless" ? `“${val}” isn't on the list. −2s` : `“${val}” isn't on the list. Try another.`;
    if(G.mode==="endless") G.deadline-=2000;
    inp.select();
    return;
  }
  if(G.mode==="endless"){
    const T=TIERS[m.tier];
    G.score+=T.pts; G.deadline+=T.bonus*1000;
    G.results.push({pi:curPrompt(),ans:val,m});
    toast(`${m.tier==="g"?"💎 ":""}${T.name} +${T.pts} · +${T.bonus}s`, `var(--${m.tier})`);
    G.i++; playPrompt();
    return;
  }
  finishPrompt(m,val);
}

function finishPrompt(m,val){
  cancelAnimationFrame(raf);
  G.stage="reveal"; G.revealAt=performance.now();
  const pi=curPrompt();
  const pts=m?TIERS[m.tier].pts:0;
  G.score+=pts;
  G.results.push({pi,ans:val,m});
  const gem=gemOf(pi);
  const rares=sample(INDEX[pi].filter(e=>e.tier==="r"&&e!==m),3).map(e=>e.label);
  const commons=INDEX[pi].filter(e=>e.tier==="c").slice(0,3).map(e=>e.label);
  const badge = m ? `<span class="badge ${TIERS[m.tier].cls}">${m.tier==="g"?"💎 ":""}${TIERS[m.tier].name}</span>`
                  : `<span class="badge b-x">${val&&val.trim()?"Not on the list":"No answer"}</span>`;
  const last = G.i>=ROUND-1;
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Quit</button><span>${G.mode==="versus"?esc(G.players[G.p].name)+" · ":""}${G.i+1} / ${ROUND}</span><span class="score">${G.score} pts</span></div>
  <div class="stage">
    <div class="q" style="min-height:0;font-size:24px;margin-bottom:14px">${esc(BANK[pi].q)}</div>
    ${badge}
    <div class="pts" style="color:${m?`var(--${m.tier})`:"var(--mute)"}">+${pts}</div>
    <div class="yours">${m?`You said <b style="color:var(--ink)">${esc(m.label)}</b>`:"&nbsp;"}</div>
    ${hideAnswers(G.mode)?`<div class="card reveal-list tmeta" style="text-align:center">🤫 The gem and top answers stay hidden until the host reveals them. No spoilers!</div>`:`
    <div class="card reveal-list">
      <div class="row" style="border-top:none"><span>The gem</span><span class="gem">💎 ${esc(gem.label)}</span></div>
      <div class="row"><span>Everyone says</span><span>${commons.map(esc).join(", ")}</span></div>
      ${rares.length?`<div class="row"><span>Rare picks</span><span>${rares.map(esc).join(", ")}</span></div>`:""}
    </div>`}
    <button class="btn wide" id="next">${last?(G.mode==="versus"&&G.p===0?"Hand it over →":"See results"):"Next prompt →"}</button>
  </div>`;
  document.getElementById("next").onclick=next;
  document.getElementById("quit").onclick=home;
}

function next(){
  if(!G||G.stage!=="reveal") return;
  if(G.i>=ROUND-1) return G.mode==="versus" ? versusAfter() : endGame();
  G.i++; playPrompt();
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && G && G.stage==="reveal" && performance.now()-G.revealAt>350){e.preventDefault();next();}
});

/* ---------- Results ---------- */
function gridFor(results){return results.map(r=>r.m?TIERS[r.m.tier].sq:MISS_SQ).join("")}
function resultRows(results){
  return results.map(r=>`<div class="res-row">
      <div class="rq">${esc(BANK[r.pi].q)}</div>
      <div>${r.m?esc(r.m.label):`<span style="color:var(--mute)">${r.ans?esc(r.ans)+" ✗":"—"}</span>`}</div>
      <div>${r.m?`<span class="badge ${TIERS[r.m.tier].cls}">+${TIERS[r.m.tier].pts}</span>`:`<span class="badge b-x">0</span>`}</div>
    </div>`).join("");
}
function endGame(){
  cancelAnimationFrame(raf);
  G.stage="done";
  if(G.mode==="party"||G.mode==="test"){
    const card={team:G.team,name:G.name,score:G.score,grid:gridFor(G.results),run:G.run||0,round:G.round||0,
      gems:G.results.filter(r=>r.m&&r.m.tier==="g").length,
      rows:G.results.map(r=>({pi:r.pi,label:r.m?r.m.label:"",tier:r.m?r.m.tier:""}))};
    if(G.mode==="party"){ const P=partyState(); P["r"+G.round]=card; savePartyState(P); } // test runs never lock the phone
    return partyCard(card, G.mode==="test");
  }
  const grid=gridFor(G.results);
  let header="", share="";
  if(G.mode==="daily"){
    const k="deepcut-"+todayKey(); const prev=store.get(k);
    if(!prev||G.score>prev.score) store.set(k,{score:G.score,grid});
    share=`Deep Cut #${dailyNumber()} · ${G.score} pts\n${grid}`;
    header=`<p class="sub" style="margin:0">Today's set #${dailyNumber()}</p>`;
  } else {
    const gems=G.results.filter(r=>r.m&&r.m.tier==="g").length;
    share=`Deep Cut Endless · ${G.score} pts · ${G.results.filter(r=>r.m).length} answers${gems?` · ${gems} 💎`:""}`;
    header=`<p class="sub" style="margin:0">Endless · ${G.results.filter(r=>r.m).length} answers before the clock ran out</p>`;
  }
  const best = G.mode==="endless" ? (()=>{const b=store.get("deepcut-endless-best")||0; if(G.score>b) store.set("deepcut-endless-best",G.score); return Math.max(b,G.score);})() : null;
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Home</button><span></span><span></span></div>
  <div class="stage">
    ${header}
    <div class="big">${G.score}</div>
    <div class="grid">${G.mode==="daily"?grid:""}</div>
    ${best!==null?`<p class="sub" style="margin:0 0 6px">Personal best: ${best}</p>`:""}
    <div style="display:flex;gap:8px;width:100%;margin:12px 0 14px">
      <button class="btn" style="flex:1" id="copy">Copy result</button>
      <button class="btn ghost" style="flex:1" id="again">${G.mode==="daily"?"Play endless":"Play again"}</button>
    </div>
  </div>
  <div class="card">${resultRows(G.results)}</div>`;
  document.getElementById("quit").onclick=home;
  document.getElementById("again").onclick=()=>start("endless");
  document.getElementById("copy").onclick=async e=>{
    try{await navigator.clipboard.writeText(share);e.target.textContent="Copied!";}
    catch(err){e.target.textContent="Copy failed";}
  };
}

/* ---------- Party: state, hub, rounds, score cards ---------- */
// One record per phone: who's playing, plus each finished round's card.
function partyState(){
  let P=store.get("deepcut-party");
  if(!P){ const old=store.get("deepcut-party-done"); P=old?{team:old.team,name:old.name,r1:{...old,round:1}}:{}; }
  return P;
}
function savePartyState(P){store.set("deepcut-party",P);}
function partyTotal(P){let t=0;for(let r=1;r<=PARTY_ROUNDS;r++) if(P["r"+r]) t+=P["r"+r].score; return t;}
function partyPill(){
  const P=partyState(); const done=ROUND_NUMS.filter(r=>P["r"+r]).length;
  return done===0?`${PARTY_ROUNDS} rounds`:done===PARTY_ROUNDS?`done · ${partyTotal(P)} pts`:`${done}/${PARTY_ROUNDS} done · ${partyTotal(P)} pts`;
}
const ROUND_NUMS = Array.from({length:PARTY_ROUNDS},(_,i)=>i+1);
// openRound = the highest round the host has opened (Round 1 is always open).
let openRound=1, answersOpen=false, hubPollT=0;
async function fetchState(){ try{const s=await api("/state"); openRound=Math.max(1,Math.min(PARTY_ROUNDS,s.openRound|0||(s.round2Open?2:1))); answersOpen=!!s.answersOpen;}catch(e){} return openRound; }
// Everyone plays the same party prompts, so answers stay hidden until the host reveals them.
const hideAnswers=mode=>mode==="party"&&!answersOpen;

function partyJoin(test){
  if(!test){ const P=partyState(); if(P.name) return partyHub(); }
  const me=store.get("deepcut-me")||{};
  let team=Number.isInteger(me.team)?me.team:null, run=null;
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Home</button><span>${test?"🧪 Test run":"🎂 Birthday party"}</span><span></span></div>
  ${test?`
  <h2>Test run</h2>
  <p class="sub">Practice prompts that are <b style="color:var(--ink)">never in the real party rounds</b>. Play as many times as you like. Everyone testing together should pick the same run. Scores from different runs add up per person, just like the party rounds will.</p>
  <div class="teamgrid">${Array.from({length:TEST_RUNS},(_,k)=>`<button class="teambtn runbtn" data-r="${k+1}" style="--tc:var(--accent)">🧪<span>Run ${k+1}</span></button>`).join("")}</div>
  <div class="section-label" style="margin-top:6px">Your team</div>`:`
  <h2>Pick your team</h2>
  <p class="sub">You'll play <b style="color:var(--ink)">${PARTY_ROUNDS} rounds</b> for this team, one try each. Every round adds up.</p>`}
  <div class="teamgrid">${TEAMS.map((t,i)=>`<button class="teambtn team ${team===i?"sel":""}" data-i="${i}" style="--tc:${t.col}">${t.e}<span>${t.n}</span></button>`).join("")}</div>
  <div class="field"><input type="text" id="pname" placeholder="Your name" maxlength="18" autocomplete="off" value="${esc(me.name||"")}"></div>
  <div class="msg" id="msg">&nbsp;</div>
  <button class="btn wide" id="go">${test?"Start test run":"Continue"}</button>`;
  document.getElementById("quit").onclick=home;
  app.querySelectorAll(".teambtn.team").forEach(b=>b.onclick=()=>{
    team=+b.dataset.i;
    app.querySelectorAll(".teambtn.team").forEach(x=>x.classList.toggle("sel",x===b));
  });
  app.querySelectorAll(".runbtn").forEach(b=>b.onclick=()=>{
    run=+b.dataset.r;

  });

    if(team===null){msg.className="msg bad";msg.textContent="Pick a team first.";return;}
    if(!name){msg.className="msg bad";msg.textContent="Add your name so the scoreboard knows who scored.";return;}
    store.set("deepcut-me",{team,name});
    if(test) return start("test",{team,name,run});
    savePartyState({team,name}); partyHub();
  };
}

function partyHub(){
  clearTimeout(hubPollT);
  const P=partyState(); const t=TEAMS[P.team];
  const roundRow=(n,card,locked)=>`
    <div class="roundrow">
      <div><div class="rl">Round ${n}</div><div class="rs">${card?`${card.grid}`:locked?(P["r"+(n-1)]?"🔒 Opens when the host says go":`🔒 Finish Round ${n-1} first`):`7 prompts · ${PER_PROMPT}s each`}</div></div>
      ${card?`<button class="btn ghost" data-view="${n}">${card.score} pts</button>`
            :`<button class="btn" data-play="${n}" ${locked?"disabled":""}>${locked?"Locked":"Play"}</button>`}
    </div>`;
  const locked=n=>!P["r"+n] && n>1 && (!P["r"+(n-1)] || openRound<n);
  const nextUp=ROUND_NUMS.find(n=>!P["r"+n]);
  const allDone=!nextUp;
  const waiting=nextUp>1 && locked(nextUp) && P["r"+(nextUp-1)];
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Home</button><span>🎂 Birthday party</span><span></span></div>
  <div class="scorecard" style="--tc:${t.col};padding:18px">
    <div class="sc-team">${t.e} ${t.n}</div>
    <div class="sc-name">${esc(P.name)}</div>
    <div class="big" style="font-size:52px">${partyTotal(P)}</div>
    <div class="sub" style="margin:0">total points</div>
  </div>
  <div class="card" style="margin-top:12px">
    ${ROUND_NUMS.map(n=>roundRow(n,P["r"+n],locked(n))).join("")}
    ${waiting?`<div class="tmeta" style="margin-top:8px">Round ${nextUp} opens when the host says go. This page checks automatically, so you can leave it open.</div>`:""}
  </div>
  ${allDone?`<p class="sub" style="text-align:center">🎉 You're done! Watch the scoreboard to see where your team lands.${answersOpen?" Answers are out: tap a round to see the gems.":""}</p>`:""}
  <button class="linkbtn" id="other" style="display:block;margin:10px auto 0;font-size:14px">Someone else playing on this phone?</button>`;
  document.getElementById("quit").onclick=()=>{clearTimeout(hubPollT);home();};
  document.getElementById("other").onclick=()=>{clearTimeout(hubPollT);savePartyState({});store.set("deepcut-party-done",null);partyJoin(false);};
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.play; clearTimeout(hubPollT);
    start("party",{team:P.team,name:P.name,round:n});
  });
  app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{clearTimeout(hubPollT);partyCard(P["r"+b.dataset.view],false);});
  // Re-send any card that hasn't reached the scoreboard yet.
  for(const n of ROUND_NUMS) if(P["r"+n]&&!P["r"+n].sent) sendCard(P["r"+n],false,true);
  // Keep checking for the host opening the next round or revealing the answers.
  if(waiting||!answersOpen){
    const was=openRound+":"+answersOpen;
    const tick=async()=>{ await fetchState(); if(openRound+":"+answersOpen!==was) return partyHub(); hubPollT=setTimeout(tick,5000); };
    hubPollT=setTimeout(tick,1500);
  }
}

function partyCard(c,test){

/* ---------- Server: automatic score submission ---------- */
async function api(path, opts={}){
  const pin=store.get("deepcut-pin");
  const r=await fetch("/api"+path,{method:opts.method||"GET",
    headers:{"content-type":"application/json",...(opts.host&&pin?{"x-host-pin":pin}:{})},
    body:opts.body?JSON.stringify(opts.body):undefined,cache:"no-store"});
  let d={}; try{d=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(d.error||("HTTP "+r.status)); e.status=r.status; throw e;}
  return d;
}
function deviceId(){
  let d=store.get("deepcut-device");
  if(!d){d=(Math.random().toString(36).slice(2,10)+Date.now().toString(36)).replace(/[^a-z0-9]/g,"");store.set("deepcut-device",d);}
  return d;
}
// One entry per person per round (live) or per run (test); scores across rounds/runs add up.
function cardBody(c,test){
  const who=deviceId()+":"+(norm(c.name)||"player");
  return test
    ? {board:"test", id:(who+":t"+(c.run||0)).slice(0,80), team:c.team, name:c.name, score:c.score, gems:c.gems||0, grid:c.grid, run:c.run||0}
    : {board:"live", id:(who+":r"+(c.round||1)).slice(0,80), team:c.team, name:c.name, score:c.score, gems:c.gems||0, grid:c.grid, run:c.round||1};
}
function pendingList(){return store.get("deepcut-pending")||[]}
function setPending(list){store.set("deepcut-pending",list)}
async function flushPending(){
  const list=pendingList(); if(!list.length) return;
  const left=[];
  for(const b of list){ try{await api("/scores",{method:"POST",body:b});}catch(e){ if(!e.status||e.status>=500) left.push(b); } }
  setPending(left);
}
async function sendCard(c,test,quiet){
  const el=()=>quiet?null:document.getElementById("sendstat");
  const show=(cls,html)=>{const e=el(); if(e){e.className="sendstat "+cls; e.innerHTML=html;}};
  const body=cardBody(c,test);
  const roundTxt=test?"":` (Round ${c.round||1})`;
  if(!test && c.sent){ show("ok",`✅ On the scoreboard for <b>${esc(TEAMS[c.team].n)}</b>${roundTxt}.`); return; }
  show("wait","Sending your score to the scoreboard…");
  try{
    await api("/scores",{method:"POST",body});
    setPending(pendingList().filter(b=>!(b.id===body.id&&b.board===body.board)));
    if(!test){ c.sent=true; const P=partyState(); if(P["r"+(c.round||1)]){P["r"+(c.round||1)].sent=true; savePartyState(P);} }
    show("ok",`✅ Sent! Your score counts for <b>${esc(TEAMS[c.team].n)}</b>${test?" on the test board":roundTxt}.`);
  }catch(e){
    if(!e.status||e.status>=500){ setPending(pendingList().filter(b=>!(b.id===body.id&&b.board===body.board)).concat([body])); }
    show("bad",`Couldn't reach the scoreboard${e.status&&e.status<500?" ("+esc(e.message)+")":""}. <button class="btn ghost" id="retry" style="padding:8px 12px;font-size:14px;margin-left:6px">Try again</button>`);
    const r=document.getElementById("retry"); if(r) r.onclick=()=>sendCard(c,test);
  }
}

/* ---------- Scoreboard (updates itself every few seconds) ---------- */
let boardMode=store.get("deepcut-board-mode")==="test"?"test":"live";
let BD={entries:[],names:TEAMS.map(t=>t.n)}, bdKey="", pollT=0, bdState="loading";
let hostOn=false, hostTeam=null, hostRound=1, resetArmed=false, renaming=false;
function onBoard(){return location.hash==="#scoreboard"}
function teamName(i){return (BD.names&&BD.names[i])||TEAMS[i].n}

function renderBoard(){
  G=null; cancelAnimationFrame(raf);
  const test=boardMode==="test";
  app.innerHTML=`
  <div class="topbar"><button class="linkbtn" id="quit">← Game</button><span>📋 Scoreboard</span><span class="livedot" id="bstat"></span></div>
  <div class="seg">
    <button data-m="live" class="${!test?"on":""}">🎂 Live party</button>
    <button data-m="test" class="${test?"on":""}">🧪 Test</button>
  </div>
  ${test?`<div class="testbanner">🧪 TEST BOARD · practice scores only, kept apart from the real party</div>`:""}
  <div id="lb"></div>
  <div id="hostarea"></div>`;
  document.getElementById("quit").onclick=()=>{clearTimeout(pollT);history.replaceState(null,"",location.pathname+location.search);home();};
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    if(b.dataset.m===boardMode) return;
    boardMode=b.dataset.m; store.set("deepcut-board-mode",boardMode);
    resetArmed=false; renaming=false; bdKey=""; BD={entries:[],names:TEAMS.map(t=>t.n)}; bdState="loading";
    renderBoard();
  });
  paintBoard(); paintHost(); setBoardStatus();
  if(store.get("deepcut-pin")&&!hostOn){
    api("/host/check",{host:true}).then(()=>{hostOn=true;paintHost();}).catch(e=>{if(e.status===401)store.set("deepcut-pin",null);});
  }
  poll();
}
let lastState="";
async function poll(){
  clearTimeout(pollT);
  if(!onBoard()) return;
  const mode=boardMode;
  try{
    const [d]=await Promise.all([api("/scores?board="+mode), mode==="live"?fetchState().then(()=>{ const k=openRound+":"+answersOpen; if(k!==lastState){ lastState=k; if(hostOn) paintHost(); } }):null]);
    if(mode!==boardMode||!onBoard()) return;
    bdState="ok";
    const k=JSON.stringify(d);
    if(k!==bdKey){
      bdKey=k;
      BD={entries:Array.isArray(d.entries)?d.entries:[],names:Array.isArray(d.names)&&d.names.length===TEAMS.length?d.names:TEAMS.map(t=>t.n)};
      paintBoard(); paintEntries(); paintTeamButtons(); if(!renaming) paintRename();
    }
  }catch(e){ bdState="error"; }
  setBoardStatus();
  pollT=setTimeout(poll,3000);
}
function setBoardStatus(){
  const s=document.getElementById("bstat"); if(!s) return;
  s.className="livedot "+bdState;
  s.textContent= bdState==="ok"?"● Live":bdState==="loading"?"Loading…":"⚠ Reconnecting";
}
function teamStats(){
  return TEAMS.map((t,i)=>{
    const es=BD.entries.filter(e=>e.team===i);
    const players={};
    for(const e of es){ const k=e.name.trim().toLowerCase(); (players[k]=players[k]||{name:e.name,total:0}).total+=(+e.score||0); }
    const plist=Object.values(players);
    const total=es.reduce((s,e)=>s+(+e.score||0),0);
    const byRound={}; for(const e of es){ const r=e.run||0; byRound[r]=(byRound[r]||0)+(+e.score||0); }
    return {i,t,es,plist,total,byRound,avg:plist.length?Math.round(total/plist.length):0};
  }).sort((a,b)=>b.total-a.total||b.avg-a.avg||a.i-b.i);
}
function paintBoard(){
  const lb=document.getElementById("lb"); if(!lb) return;
  const test=boardMode==="test", live=!test;
  const teams=teamStats();
  const group=BD.entries.reduce((s,e)=>s+(+e.score||0),0);
  const lead=Math.max(1,...teams.map(x=>x.total));
  const allPlayers=teams.flatMap(x=>x.plist);
  const mvp=allPlayers.slice().sort((a,b)=>b.total-a.total)[0];
  const gems=BD.entries.reduce((s,e)=>s+(+e.gems||0),0);
  const roundCount=n=>BD.entries.filter(e=>(e.run||0)===n).length;
  const medals=["🥇","🥈","🥉","4","5","6"];
  const split=x=>live?ROUND_NUMS.map(n=>` · R${n} ${x.byRound[n]||0}`).join(""):"";
  lb.innerHTML=`
  <div class="stage">
    <p class="sub" style="margin:0">${test?"Test group total":`Group total · all ${PARTY_ROUNDS} rounds`}</p>
    <div class="big">${group.toLocaleString()}</div>
    <p class="sub" style="margin:0 0 14px">${live?ROUND_NUMS.map(n=>`R${n}: ${roundCount(n)}/${TEAMS.length*TEAM_SIZE}`).join(" · ")+" in":`${allPlayers.length} player${allPlayers.length===1?"":"s"} in`}${gems?` · ${gems} 💎`:""}${mvp?`<br>MVP: <b style="color:var(--ink)">${esc(mvp.name)}</b> (${mvp.total})`:""}</p>
  </div>
  <div class="card" style="padding:8px 16px">
    ${teams.map((x,rank)=>`
      <div class="teamrow">
        <div class="rank">${x.total>0?medals[rank]:"·"}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
            <b>${x.t.e} ${esc(teamName(x.i))}</b><b style="font-size:20px">${x.total}</b>
          </div>
          <div class="bar"><div style="width:${Math.round(x.total/lead*100)}%;background:${x.t.col}"></div></div>
          <div class="tmeta">${x.plist.length}/${TEAM_SIZE} players${x.plist.length?split(x):""}${x.plist.length?`<br>${x.plist.sort((a,b)=>b.total-a.total).map(p=>`${esc(p.name)} ${p.total}`).join(" · ")}`:""}</div>
        </div>
      </div>`).join("")}
  </div>`;
}
function paintHost(){
  const h=document.getElementById("hostarea"); if(!h) return;
  const test=boardMode==="test";
  if(!hostOn){
    h.innerHTML=`
    <div class="card">
      <div style="font-weight:700;margin-bottom:4px">Host controls</div>
      <div class="sub" style="margin:0 0 8px;font-size:14px">Scores show up here on their own. Unlock to fix entries, rename teams, add a score by hand, or reset.</div>
      <form id="pinf" class="field" autocomplete="off">
        <input type="password" id="pin" placeholder="Host PIN" inputmode="numeric">
        <button class="btn" type="submit">Unlock</button>
      </form>
      <div class="msg" id="pinmsg">&nbsp;</div>
    </div>`;
    document.getElementById("pinf").onsubmit=async e=>{
      e.preventDefault();
      const msg=document.getElementById("pinmsg");
      store.set("deepcut-pin",document.getElementById("pin").value.trim());
      try{await api("/host/check",{host:true}); hostOn=true; paintHost();}
      catch(err){store.set("deepcut-pin",null); msg.className="msg bad"; msg.textContent=err.status===401?"Wrong PIN.":"Couldn't reach the server.";}
    };
    return;
  }
  h.innerHTML=`
  ${!test?`<div class="card r2card ${openRound>1?"open":""}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><b>${openRound>=PARTY_ROUNDS?`All ${PARTY_ROUNDS} rounds are OPEN`:openRound>1?`Rounds 1–${openRound} are open`:"Only Round 1 is open"}</b><div class="tmeta" style="margin-top:3px">${openRound<PARTY_ROUNDS?`Players who finish Round ${openRound} wait until you open Round ${openRound+1}.`:"Players can play straight through."}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${openRound<PARTY_ROUNDS?`<button class="btn" id="r2btn">Open Round ${openRound+1}</button>`:""}
        ${openRound>1?`<button class="btn ghost" id="rlockbtn" style="padding:8px 12px;font-size:14px">Lock Round ${openRound}</button>`:""}
      </div>
    </div>
  </div>
  <div class="card r2card ${answersOpen?"open":""}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><b>Answers are ${answersOpen?"REVEALED":"hidden"}</b><div class="tmeta" style="margin-top:3px">${answersOpen?"Players can see the gems and top answers.":"Players don't see the gems or top answers, so nobody can spoil them. Reveal when everyone's done."}</div></div>
      <button class="btn ${answersOpen?"ghost":""}" id="ansbtn">${answersOpen?"Hide again":"Reveal answers"}</button>
    </div>
  </div>`:""}
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>Add a score by hand${test?" (test)":""}</b>
      <button class="linkbtn" id="lock">Lock host controls</button>
    </div>
    <div class="teamgrid small" id="hteams"></div>
    ${!test?`<div class="seg" style="margin:0 0 4px;grid-template-columns:repeat(${PARTY_ROUNDS},1fr)">${ROUND_NUMS.map(n=>`<button type="button" data-r="${n}" class="${hostRound===n?"on":""}">${PARTY_ROUNDS>4?"R":"Round "}${n}</button>`).join("")}</div>`:""}
    <form id="addf" class="field" autocomplete="off">
      <input type="text" id="hname" placeholder="Name" maxlength="18">
      <input type="text" id="hscore" placeholder="Score" inputmode="numeric" style="max-width:100px">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="msg" id="hmsg">&nbsp;</div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Team names</b><button class="linkbtn" id="ren">${renaming?"Cancel":"Rename"}</button>
    </div>
    <div id="renarea"></div>
  </div>
  <div class="card" id="entries"></div>
  <button class="btn ghost wide" id="reset"></button>
  <div class="foot">Scores save to your Cloudflare database. Any screen with this page open updates by itself.</div>`;
  paintTeamButtons(); paintEntries(); paintRename(); paintReset();
  app.querySelectorAll("#hostarea .seg button").forEach(b=>b.onclick=()=>{hostRound=+b.dataset.r;app.querySelectorAll("#hostarea .seg button").forEach(x=>x.classList.toggle("on",x===b));});
  const setOpen=async n=>{
    try{const d=await api("/host/rounds",{method:"POST",host:true,body:{openRound:n}}); const was=openRound; openRound=d.openRound|0||1; paintHost();
        toast(openRound>was?`Round ${openRound} is open!`:`Round ${was} locked`, openRound>was?"var(--u)":"var(--mute)");}
    catch(e){toast(e.message,"var(--bad)");}
  };
  const r2b=document.getElementById("r2btn"); if(r2b) r2b.onclick=()=>setOpen(openRound+1);
  const rlb=document.getElementById("rlockbtn"); if(rlb) rlb.onclick=()=>setOpen(openRound-1);
  const ab=document.getElementById("ansbtn");
  if(ab) ab.onclick=async()=>{
    try{const d=await api("/host/answers",{method:"POST",host:true,body:{open:!answersOpen}}); answersOpen=!!d.answersOpen; paintHost();
        toast(answersOpen?"Answers revealed!":"Answers hidden", answersOpen?"var(--u)":"var(--mute)");}
    catch(e){toast(e.message,"var(--bad)");}
  };
  document.getElementById("lock").onclick=()=>{store.set("deepcut-pin",null);hostOn=false;paintHost();};
  document.getElementById("ren").onclick=()=>{renaming=!renaming;paintRename();document.getElementById("ren").textContent=renaming?"Cancel":"Rename";};
  document.getElementById("addf").onsubmit=async e=>{
    e.preventDefault();
    const msg=document.getElementById("hmsg");
    const name=document.getElementById("hname").value.trim();
    const score=parseInt(document.getElementById("hscore").value,10);
    if(hostTeam===null){msg.className="msg bad";msg.textContent="Tap the player's team first.";return;}
    if(!name){msg.className="msg bad";msg.textContent="Add the player's name.";return;}
    if(!Number.isFinite(score)||score<0||score>ROUND*100){msg.className="msg bad";msg.textContent=`Score should be between 0 and ${ROUND*100}.`;return;}
    try{
      await api("/host/entry",{method:"POST",host:true,body:{board:boardMode,team:hostTeam,name,score,run:boardMode==="live"?hostRound:0}});
      document.getElementById("hname").value=""; document.getElementById("hscore").value="";
      msg.className="msg"; msg.textContent=`Added ${name} (${score}) to ${teamName(hostTeam)}${boardMode==="live"?", Round "+hostRound:""}.`;
      poll();
    }catch(err){msg.className="msg bad";msg.textContent=err.message;}
  };
  document.getElementById("reset").onclick=async()=>{
    if(!resetArmed){resetArmed=true;paintReset();return;}
    try{await api("/host/reset",{method:"POST",host:true,body:{board:boardMode}});
        if(boardMode==="live"){
          openRound=(await api("/host/rounds",{method:"POST",host:true,body:{openRound:1}})).openRound|0||1;
          answersOpen=!!(await api("/host/answers",{method:"POST",host:true,body:{open:false}})).answersOpen; paintHost();}}
    catch(e){toast(e.message,"var(--bad)");}
    resetArmed=false; paintReset(); poll();
  };
}
function paintTeamButtons(){
  const g=document.getElementById("hteams"); if(!g) return;
  g.innerHTML=TEAMS.map((t,i)=>`<button type="button" class="teambtn ${hostTeam===i?"sel":""}" data-i="${i}" style="--tc:${t.col}">${t.e}<span>${esc(teamName(i))}</span></button>`).join("");
  g.querySelectorAll(".teambtn").forEach(b=>b.onclick=()=>{
    hostTeam=+b.dataset.i;
    g.querySelectorAll(".teambtn").forEach(x=>x.classList.toggle("sel",x===b));
    document.getElementById("hname").focus();
  });
}
function paintEntries(){
  const c=document.getElementById("entries"); if(!c) return;
  if(!BD.entries.length){c.innerHTML=`<b>Entries</b><div class="sub" style="margin:8px 0 0;font-size:14px">No scores yet. They'll appear here as players finish.</div>`;return;}
  c.innerHTML=`<b>Entries</b>`+BD.entries.slice().reverse().map(e=>`
    <div class="entry"><span>${TEAMS[e.team]?TEAMS[e.team].e:""} ${esc(e.name)}${e.manual?' <span class="pill">by hand</span>':""}${e.run?` <span class="pill">${boardMode==="live"?"R"+e.run:"run "+e.run}</span>`:""}</span>
    <span><b>${e.score}</b> <button class="x" data-id="${esc(e.id)}" title="Remove">✕</button></span></div>`).join("");
  c.querySelectorAll(".x").forEach(b=>b.onclick=async()=>{
    try{await api("/host/delete",{method:"POST",host:true,body:{board:boardMode,id:b.dataset.id}}); poll();}
    catch(e){toast(e.message,"var(--bad)");}
  });
}
function paintRename(){
  const r=document.getElementById("renarea"); if(!r) return;
  if(!renaming){r.innerHTML=`<div class="tmeta" style="margin-top:6px">${TEAMS.map((t,i)=>`${t.e} ${esc(teamName(i))}`).join(" · ")}</div>`;return;}
  r.innerHTML=`<div style="display:grid;gap:8px;margin-top:10px">${TEAMS.map((t,i)=>`<div style="display:flex;gap:8px;align-items:center"><span>${t.e}</span><input type="text" class="rename" data-i="${i}" value="${esc(teamName(i))}" maxlength="20" style="flex:1;max-width:none"></div>`).join("")}
    <button class="btn" id="savenames">Save names</button></div>`;
  document.getElementById("savenames").onclick=async()=>{
    const names=TEAMS.map((t,i)=>{const inp=r.querySelector(`.rename[data-i="${i}"]`);return (inp&&inp.value.trim())||t.n;});
    try{await api("/host/names",{method:"POST",host:true,body:{board:boardMode,names}});renaming=false;document.getElementById("ren").textContent="Rename";paintRename();poll();}
    catch(e){toast(e.message,"var(--bad)");}
  };
}
function paintReset(){
  const b=document.getElementById("reset"); if(!b) return;
  const test=boardMode==="test";
  b.textContent=resetArmed?`Tap again to erase every ${test?"test":"LIVE"} score`:(test?"Clear test scores":"Reset live scoreboard");
}

/* ---------- Routing ----------
   #scoreboard opens the scoreboard. #unlock-party clears the one-try lock on
   this phone (e.g. if someone tapped the real round by accident during testing). */
function route(){
  if(location.hash==="#unlock-party"){
    try{localStorage.removeItem("deepcut-party-done");localStorage.removeItem("deepcut-party");}catch(e){}
    history.replaceState(null,"",location.pathname+location.search);
    home(); toast("Party rounds unlocked on this phone","var(--u)"); return;
  }
  clearTimeout(hubPollT); // leaving the party hub: stop its background check
  if(onBoard()) renderBoard(); else { clearTimeout(pollT); if(!G||G.stage==="done") home(); }
}
window.addEventListener("hashchange",route);
route();
flushPending();
fetchState();
</script>
